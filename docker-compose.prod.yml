services:
  # Hono API (SQLite, single-user self-hosted). Built from the monorepo
  # root so pnpm resolves the `@finanzas/shared-types` workspace package.
  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: finantrack-backend
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_PATH: /data/finanzas.db
      # Optional integrations — leave blank to disable.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-finanzas-raw}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${GOOGLE_SERVICE_ACCOUNT_KEY:-}
      DRIVE_ARCHIVE_FOLDER_ID: ${DRIVE_ARCHIVE_FOLDER_ID:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - sqlite_data:/data
    restart: unless-stopped
    networks:
      - finantrack

  # Nginx: serves the built frontend SPA and proxies /api to backend:3000.
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: finantrack-web
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - finantrack

volumes:
  sqlite_data:
    driver: local

networks:
  finantrack:
    driver: bridge
